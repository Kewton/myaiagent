version: 0.5
nodes:
  # 1. キーワードを入力
  source:
    value:
      text: 最新のLLM技術トレンドとこれらの地球温暖化への影響
  
  common_param:
    value:
      target: 日本の熟練ITエンジニアかつ子育て世代、知的好奇心が豊富

  # 2. Plnnerが章に分割しアウトラインを生成
  plannerPromptBuilder:
    agent: stringTemplateAgent
    inputs:
      keywords: :source.text
      target: :common_param.target
    console:
      before: plannerPrompt start 
      after: true
    params:
      template: |-
        
        # 指示書
        あなたは優れたポッドキャストの編集者兼ライターです。
        以下の出力指示詳細と制約条件に従いユーザーから指定されたキーワードに関するポッドキャストの台本のアウトラインを出力してください。
        
        ## 出力指示詳細
        - ターゲットユーザーは「${target}」とする
        - 導入（トピックと情報源の概要説明）、本編（キーポイントの議論・展開）、結論（まとめ、考察）を含む一貫性のあるアウトラインとすること
        - overviewには各章の概要を記載すること
        - 本編は少なくとも２部以上の構成にし、あなたの知見をフルに活用して深掘りすること
        - 各章で深掘りすべき具体的なキーワードも出力すること。キーワードには一般的な表現は使わず、具体的なキーワードを出力すること
        - 出力は RESPONSE_FORMAT に従うこと。返却は JSON 形式で行い、コメントやマークダウンは含めないこと

        # 制約条件
        - 日本語で出力すること

        # RESPONSE FORMAT:
        {
          "outline": [
              {
                "title": "...", // 導入・本編・結論のいずれかが分かるように明記するとともに、具体的なキーワードを考えること。例）【導入】LLM技術のトレンドとAIエージェントの動向
                "overview": "...",
                "query_hint": ["...", "..."]
              },
              {
                "title": "...",
                "overview": "...",
                "query_hint": ["...", "..."]
              }
          ]
        }

        # キーワード:
        ${keywords}

  planner:
    agent: fetchAgent
    console:
      before: planner start
    inputs:
      # jsonフォーマットでの出力を行うユーティティエージェント
      url: http://127.0.0.1:8000/aiagent-api/v1/aiagent/utility/jsonoutput
      method: POST
      body:
        user_input: :plannerPromptBuilder
        model_name: qwen3:235b-a22b-q4_K_M
        
  # 3. Explorerが章毎に必要な情報を収集 ＊並列処理
  explorer_mapper:
    agent: mapAgent
    inputs:
      rows: :planner.result.outline
    console:
      before: explorer_mapper start
    params:
      compositeResult: true
    graph:
      nodes:
        explorerPromptBuilder:
          agent: stringTemplateAgent
          inputs:
            title: :row.title
            overview: :row.overview
            query_hint: :row.query_hint
          console:
            before: explorerPromptBuilder start 
          params:
            template: |-
              あなたは優れた情報収集者です。
              以下の入力をもとにgoogle検索より情報を収集し、あなたの知見と合わせてポッドキャストの台本の作成に必要な情報（用語の意味や概念など）を日本語で整理してください。
              出力は RESPONSE_FORMAT に従ってください。

              入力情報:
              # Title
              ${title}
              
              # Overview
              ${overview}
              
              # Query_hint
              ${query_hint}

              RESPONSE_FORMAT:
              #### 用語の意味や概念
              // ここに用語の意味や概念を記載してください
              
              #### 一般的な見解
              // 研究結果など客観的な事実を元にした見解を記載してください

              /no_think
        explorer:
          agent: fetchAgent
          console:
            before: explorer start
          inputs:
            # google検索を使用して情報収集するユーティティエージェント
            url: http://127.0.0.1:8000/aiagent-api/v1/aiagent/utility/explorer
            method: POST
            body:
              user_input: :explorerPromptBuilder
              model_name: qwen3:30b-a3b-q4_K_M
        explorer_result_summary:
          agent: stringTemplateAgent
          inputs:
            title: :row.title
            overview: :row.overview
            query_hint: :row.query_hint
            text: :explorer.result
          console:
            before: explorer_result_summary start 
          params:
            template: |-

              ### Subject：
              ${title}

              #### Overview：
              ${overview}

              #### keyword:
              ${query_hint}

              ${text}
          isResult: true
  explorer_mapper_output:
    agent: arrayJoinAgent
    console:
      before: explorer_mapper_output start
    params:
      separator: \n---\n
    inputs:
      array: :explorer_mapper.explorer_result_summary

  # 4. Generatorがアウトラインと情報をもとに台本を生成
  generatorPromptBuilder:
    agent: stringTemplateAgent
    inputs:
      explorer_result: :explorer_mapper_output.text
      source: :source.text
      target: :common_param.target
    console:
      before: generatorPromptBuilder start
      after: true
    params:
      template: |-
        # 指示書
        あなたは、複数の情報源からのデータを統合してポッドキャスト台本を作成するツールです。
        以下のポッドキャストパラメータと制約条件に従い入力情報とに基づいて、ユーザーから指定されたキーワードに関する一貫性のある台本テキストのみを出力してください。

        ## 出力指示詳細
        - ターゲットユーザーは「${target}」とする
        - 全体のアウトラインと抽出・統合した情報に基づき、導入（トピックと情報源の概要説明）、本編（キーポイントの議論・展開）、結論（まとめ、考察）を含む一貫性のある台本を作成してください
        - 本編ではしっかりと掘り下げた議論を行い、結論では考察を行うこと

        # ポッドキャストパラメータ
        * **tone:** 深掘り討論
        * **volume:** 日本語で1500~2500文字（6000バイト程度）
        
        # 制約条件
        - 日本語で出力すること
        - 出力に記号やマークダウンは含めないこと
          - NG例: **スパースアクティベーション**
          - OK例: スパースアクティベーション
        - BGMの考慮はしないこと
          - 下記のような出力は不要
            ```
            ## 【イントロダクション】  
            （背景音：穏やかなピアノメロディ） 
            ```
        - AI(TTS)により音声化することを想定した改行とすること
        - 返却結果をそのままmp3ファイルに変換するので台本テキストのみとすること
        - 「はい、承知いたしました〜」は出力せず、ポッドキャストの台本のみを出力すること
          - NG例：はい、承知いたしました〜・・・。\n\n---\n\n皆さん、こんにちは。・・
          - OK例：皆さん、こんにちは。・・・

        # 入力情報
        ## ユーザーからのキーワード
        ${source}

        ## 全体のアウトラインと抽出・統合した情報
        ${explorer_result}

        # 生成開始

  generator:
    agent: fetchAgent
    console:
      before: generator start
      after: true
    inputs:
      url: http://127.0.0.1:8000/aiagent-api/v1/mylllm
      method: POST
      body:
        user_input: :generatorPromptBuilder
        model_name: qwen3:235b-a22b-q4_K_M

  # 5. Actionが台本を音声化
  action:
    agent: fetchAgent
    console:
      before: action start
      after: true
    inputs:
      url: http://127.0.0.1:8000/aiagent-api/v1/utility/tts_and_upload_drive
      method: POST
      body:
        user_input: :generator.text

  output:
    agent: copyAgent
    console:
      before: output start 
    params:
      namedKey: text
    inputs:
      text: :action.result
    isResult: true