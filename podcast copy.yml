version: 0.5
loop:
  while: :outline
nodes:
  source:
    value:
      keywords: 量子コンピューティング
  plannerPrompt:
    agent: stringTemplateAgent
    inputs:
      keywords: :source.keywords
    console:
      before: plannerPrompt start 
      after: true
    params:
      template: |-
        あなたは優れたポッドキャストの編集者兼ライターです。
        以下のキーワードをもとに情報を収集し、あなたの知見と合わせてポッドキャストの台本のアウトラインを日本語で作成してください。
        また、各章で深掘りすべき具体的なキーワードも考えてください。（一般的な表現は使わず、具体的なキーワードを考えてください。）
        なお、返却は JSON 形式で行い、コメントやマークダウンは含めないでください。


        RESPONSE FORMAT:
        {
          "outline": [
              {
                "title": "...",
                "overview": "...",
                "expected_words": 200,
                "query_hint": ["...", "..."]
              }
          ]
        }

        User keywords: ${keywords}
  planner:
    agent: fetchAgent
    console:
      before: planner start
    inputs:
      url: http://127.0.0.1:8000/aiagent-api/v1/aiagent/utility/jsonoutput
      method: POST
      body:
        user_input: :plannerPrompt
  # １章
  plannerResult_0:
    agent: stringTemplateAgent
    inputs:
      title: :planner.result.outline.$0.title
      overview: :planner.result.outline.$0.overview
      query_hint: :planner.result.outline.$0.query_hint
    console:
      before: plannerResult_0 start 
      after: true
    params:
      template: |-
        あなたは優れた情報収集者です。
        以下のキーワードをもとに広く情報を収集し、あなたの知見と合わせてポッドキャストの台本の作成に必要な情報（用語の意味や概念など）を日本語で整理してください。
        
        Title：${title}
        Overview：${overview}
        Query_hint: ${query_hint}
  explorer_0:
    agent: fetchAgent
    console:
      before: explorer_0 start
      after: true
    timeout: 600000
    inputs:
      url: http://127.0.0.1:8000/aiagent-api/v1/aiagent/utility/explorer
      method: POST
      body:
        user_input: :plannerResult_0
  explorerResult_0:
    agent: stringTemplateAgent
    inputs:
      title: :planner.result.outline.$0.title
      overview: :planner.result.outline.$0.overview
      query_hint: :planner.result.outline.$0.query_hint
      reference_Information: :explorer_0.result
    console:
      before: explorerResult_0 start 
      after: true
    params:
      template: |-
        あなたは優れたポッドキャストのライターです。
        以下の情報をもとに、ポッドキャストの台本を作成してください。

        Title：${title}
        Overview：${overview}
        Query_hint: ${query_hint}
        Reference_Information: ${reference_Information}
  generator_0:
    agent: openAIAgent
    params:
      model: gpt-4.1
    console:
      before: generator_0 start 
      after: true
    inputs:
      prompt: :explorerResult_0
  # ２章
  plannerResult_1:
    agent: stringTemplateAgent
    inputs:
      title: :planner.result.outline.$1.title
      overview: :planner.result.outline.$1.overview
      query_hint: :planner.result.outline.$1.query_hint
    console:
      before: plannerResult_1 start 
      after: true
    params:
      template: |-
        あなたは優れた情報収集者です。
        以下のキーワードをもとに広く情報を収集し、あなたの知見と合わせてポッドキャストの台本の作成に必要な情報（用語の意味や概念など）を日本語で整理してください。
        
        Title：${title}
        Overview：${overview}
        Query_hint: ${query_hint}
  explorer_1:
    agent: fetchAgent
    console:
      before: explorer_1 start
      after: true
    timeout: 600000
    inputs:
      url: http://127.0.0.1:8000/aiagent-api/v1/aiagent/utility/explorer
      method: POST
      body:
        user_input: :plannerResult_1
  explorerResult_1:
    agent: stringTemplateAgent
    inputs:
      title: :planner.result.outline.$1.title
      overview: :planner.result.outline.$1.overview
      query_hint: :planner.result.outline.$1.query_hint
      reference_Information: :explorer_1.result
    console:
      before: explorerResult_1 start 
    params:
      template: |-
        あなたは優れたポッドキャストのライターです。
        以下の情報をもとに、ポッドキャストの台本を作成してください。

        Title：${title}
        Overview：${overview}
        Query_hint: ${query_hint}
        Reference_Information: ${reference_Information}
  generator_1:
    agent: openAIAgent
    params:
      model: gpt-4.1
    console:
      before: generator_1 start 
    inputs:
      prompt: :explorerResult_1
  # 統合
  output:
    agent: copyAgent
    console:
      before: output start
    inputs:
      result_0: :generator_0.text
      result_1: :generator_1.text
    isResult: true